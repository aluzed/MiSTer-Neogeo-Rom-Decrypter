[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mister-neogeo-rom-decrypter"
version = "0.1.0"
description = "Convert MAME/NeoRageX NeoGeo romsets into Darksoft format for MiSTer FPGA."
readme = "Readme.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aluzed" }]
keywords = ["mister", "fpga", "neogeo", "darksoft", "rom"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
darksoft-gen = "darksoft_gen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/darksoft_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
